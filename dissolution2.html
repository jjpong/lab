<!--
📡 廣播功能（2026-10-03）
- 這個模擬可以放在外框（WebQuest／AI 夥伴）的 iframe 裡，透過 window.parent.postMessage 傳出訊息：
  1. EXPERIMENT_MANIFEST：載入時送一次，宣告變因（含 recordField）、功能、可比對的 actionText 清單。
  2. SIMULATION_STATE：學生每次操作送一次；操作後讀數穩定（約 3 秒不變）再自動送一次
     「【自動】操作後讀數已穩定」（只廣播，不記錄數據）。
  3. 學生自己設計的「實驗記錄表」：每次改動都廣播整張表（學生的實驗記錄表），
     並附上每一列填寫當時的實際狀態，供 AI 核對（學生畫面看不到）；
     表格名稱與「我的發現」也一起廣播。
  4. 照片與圖說只放進下載的 Word 實驗報告給老師看，不廣播給 AI（只廣播「拍了照片」「下載了報告」這類動作）。
- payload 主要欄位：log摘要、學生最後的動作、目前介面階段、當前觀察視角、溶質、容器、水量(mL)、水溫(°C)、
  加入／溶解／未溶解的溶質(g)、重量百分濃度(%)、杯底有沉澱、圖表、學生的實驗記錄表；
  另有「理論判斷」（學生畫面看不到，供 AI 引導用）與「微觀畫面特徵」（微觀模式時）。
- 單獨用瀏覽器開啟時，訊息會送給自己，不影響使用。
-->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>溶解與飽和模擬</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#ffffff; --ink:#1d2433; --muted:#667085; --line:#e3e7ef;
    --accent:#c62834; --blue:#2f6fde; --orange:#e8742a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;}
  /* 版面：左＝操作、中＝燒杯、右＝數據與圖表 */
  .app{max-width:1600px;margin:0 auto;padding:16px;display:grid;gap:16px;align-items:start;
    grid-template-columns:300px minmax(0,1fr) 340px;grid-template-areas:"ctrl stage data"}
  .stage{grid-area:stage} .ctrl{grid-area:ctrl} .data{grid-area:data}
  @media (max-width:1180px){.app{grid-template-columns:300px minmax(0,1fr);grid-template-areas:"ctrl stage" "ctrl data"}}
  @media (max-width:880px){.app{grid-template-columns:1fr;grid-template-areas:"stage" "ctrl" "data"}}
  .stage{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;position:relative;align-self:start}
  #sim{width:100%;height:auto;display:block;touch-action:none;cursor:pointer}
  .hint{position:absolute;left:18px;top:14px;font-size:13px;color:var(--muted)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
  h1{font-size:20px;margin:0}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{flex:1;border:0;background:transparent;padding:8px 4px;font-size:14px;cursor:pointer;color:var(--muted)}
  .seg button.on{background:var(--ink);color:#fff}
  .seg.small button{font-size:12px;padding:5px 4px}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .btns button{border:1px solid var(--line);background:#fafbfd;border-radius:10px;padding:9px 6px;font-size:14px;cursor:pointer}
  .btns button:hover{background:#eef1f7}
  .btns button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
  label b{color:var(--ink)}
  input[type=range]{width:100%}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stat{background:#f7f8fb;border-radius:10px;padding:8px 10px}
  .stat .k{font-size:12px;color:var(--muted)}
  .stat .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
  .state[hidden]{display:none}
  .state{font-weight:600;padding:6px 10px;border-radius:8px;background:#eef1f7;text-align:center}
  .state.sat{background:#fde8e9;color:var(--accent)}
  .chartbox{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
  .chartWrap{position:relative;height:190px}
  #chart{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
  .ctop{display:flex;gap:8px;align-items:center}
  .ctop .seg{flex:1}
  #popBtn{border:1px solid var(--line);background:#fafbfd;border-radius:10px;padding:5px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
  #popBtn:hover{background:#eef1f7}
  .floatwin{position:fixed;z-index:50;background:#fff;border:1px solid #cfd5df;border-radius:12px;
    box-shadow:0 12px 40px rgba(29,36,51,.22);display:flex;flex-direction:column;min-width:320px;min-height:260px;overflow:hidden}
  .floatwin[hidden]{display:none}
  .fw-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:#1d2433;color:#fff;
    font-size:13px;font-weight:600;cursor:move;user-select:none;touch-action:none}
  .fw-bar button{border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer}
  .fw-body{flex:1;display:flex;min-height:0;padding:8px}
  .fw-body .chartbox{flex:1;border:0;padding:4px;min-height:0}
  .fw-body .chartWrap{flex:1;height:auto;min-height:120px}
  .snap{position:absolute;right:14px;bottom:12px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-size:13px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.06)}
  .snap:hover{background:#eef1f7}
  .snap-sm{border:1px solid var(--line);background:#fafbfd;border-radius:10px;padding:5px 8px;font-size:12px;cursor:pointer}
  .flash{animation:flash .35s ease-out}
  @keyframes flash{from{box-shadow:0 0 0 6px rgba(255,255,255,1),0 0 0 9px rgba(47,111,222,.5)}to{box-shadow:none}}
  #rtabs{margin-top:2px}
  .photobox{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
  .hint2{font-size:12px;color:var(--muted);margin:0;line-height:1.5}
  .photo{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;position:relative}
  .photo img{width:100%;border-radius:6px;border:1px solid #eef0f5}
  .photo .pl{font-size:12px;font-weight:600;color:var(--muted)}
  .photo textarea{width:100%;min-height:52px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;line-height:1.5}
  .photo .x-btn{top:14px;transform:none;right:8px;background:#fff;border-radius:6px}
  .dl{border:0;background:var(--ink);color:#fff;border-radius:12px;padding:12px;font-size:15px;font-weight:600;cursor:pointer}
  .dl:hover{opacity:.9}
  .tablebox{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:0}
  .tb-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .tb-top b{font-size:14px;white-space:nowrap}
  #tbTitle{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;font-weight:600}
  #tbTitle:focus,#findings:focus{outline:2px solid #f5d77a;border-color:#e5c45a}
  .find-label{font-size:13px;font-weight:600;margin-top:4px}
  #findings{width:100%;min-height:90px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:13px;line-height:1.6}
  .fw-body .tablebox #findings{min-height:70px}
  .tb-pop{border:1px solid var(--line);background:#fafbfd;border-radius:10px;padding:5px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
  .tb-scroll{overflow:auto;max-height:260px;border:1px solid var(--line);border-radius:8px}
  .fw-body .tablebox{flex:1;border:0;padding:4px}
  .fw-body .tb-scroll{flex:1;max-height:none}
  #recTable{border-collapse:collapse;font-size:13px;min-width:100%}
  #recTable th,#recTable td{border:1px solid var(--line);padding:0;position:relative}
  #recTable th{background:#f3f5f9}
  #recTable input{width:100%;min-width:72px;border:0;background:transparent;padding:6px 6px;font:inherit;font-size:13px;text-align:center;outline:none}
  #recTable th input{font-weight:600;padding-right:18px}
  #recTable input:focus{background:#fff8e1}
  #recTable input::placeholder{color:#b0b8c4;font-weight:400}
  .x-btn{position:absolute;right:2px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#98a2b3;cursor:pointer;font-size:12px;padding:2px 4px}
  .x-btn:hover{color:var(--accent)}
  #recTable td.rowdel{width:26px;min-width:26px;text-align:center;border-color:transparent;background:#fff}
  #recTable td.rowdel .x-btn{position:static;transform:none}
  .tb-tools{display:flex;gap:6px;flex-wrap:wrap}
  .tb-tools button{border:1px solid var(--line);background:#fafbfd;border-radius:10px;padding:6px 10px;font-size:12px;cursor:pointer}
  .tb-tools button:hover{background:#eef1f7}
  .tb-tools .danger{margin-left:auto;color:var(--accent)}
  .fw-resize{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;
    background:linear-gradient(135deg,transparent 50%,#9aa3b2 50%,#9aa3b2 60%,transparent 60%,transparent 70%,#9aa3b2 70%,#9aa3b2 80%,transparent 80%)}
  .ctools{display:flex;gap:8px;align-items:center}
  .ctools .seg{flex:1}
  #pause{border:1px solid var(--line);background:#fafbfd;border-radius:10px;padding:5px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
  #pause.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .legend{display:flex;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px;background:var(--c);border:1px solid var(--e, transparent)}
  .legend.rings span::before{background:transparent;border:2px solid var(--c)}
  .note{font-size:13px;color:var(--muted);line-height:1.6;margin:0}
  .foot{font-size:12px;color:#98a2b3;margin:0}
  #subSeg{display:grid;grid-template-columns:repeat(3,1fr)}
  #subSeg button{border-top:1px solid var(--line)}
  #subSeg button:nth-child(-n+3){border-top:0}
  input[type=range]:disabled{opacity:.4}
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <canvas id="sim"></canvas>
    <div class="hint">點罐子（或按空白鍵）撒溶質<br>用杯底的裝置加熱或降溫</div>
    <button class="snap" id="snapBeaker" title="把目前的燒杯畫面拍下來，放進實驗報告">📷 拍照</button>
  </div>

  <div class="panel ctrl">
    <h1>溶解與飽和</h1>
    <div class="seg" id="subSeg">
      <button data-sub="lactose" class="on">食用色素</button>
      <button data-sub="sucrose">蔗糖</button>
      <button data-sub="nacl">食鹽</button>
      <button data-sub="agcl">氯化銀</button>
      <button data-sub="kno3">硝酸鉀</button>
      <button data-sub="naoh">氫氧化鈉</button>
    </div>
    <div class="seg">
      <button id="vMicro">微觀（粒子）</button>
      <button id="vMacro" class="on">巨觀（顏色）</button>
    </div>
    <div class="btns">
      <button id="shake" class="primary">撒一些</button>
      <button id="pour">倒一大匙</button>
      <button id="stir">攪拌</button>
      <button id="reset">重來</button>
      <button id="addW">加水 50 mL</button>
      <button id="evap">蒸發 50 mL</button>
    </div>
    <div class="seg small">
      <button id="mBath" class="on">恆溫水浴</button>
      <button id="mInsul">隔熱杯</button>
    </div>
    <label><div><span id="tempK">水溫</span>：<b id="tempV">25 °C</b></div>
      <input type="range" id="temp" min="0" max="80" step="1" value="25"></label>
    <label><div>播放速度：<b id="spdV">1×</b></div>
      <input type="range" id="spd" min="0.25" max="3" step="0.25" value="1"></label>

  </div>

  <div class="panel data">
    <div class="state" id="state" hidden>純水</div>
    <div class="stats">
      <div class="stat"><div class="k" id="k1"></div><div class="v" id="v1">0</div></div>
      <div class="stat"><div class="k" id="k2"></div><div class="v" id="v2">0</div></div>
      <div class="stat"><div class="k" id="k3"></div><div class="v" id="v3">0</div></div>
      <div class="stat"><div class="k" id="k4"></div><div class="v" id="v4">0</div></div>
    </div>
    <div class="seg" id="rtabs">
      <button id="rtData" class="on">數據與圖表</button>
      <button id="rtReport">我的報告</button>
    </div>
    <div id="paneData" style="display:flex;flex-direction:column;gap:12px">
    <div id="microLegend">
      <div class="legend" id="partLegend"></div>
      <div class="legend rings" style="margin-top:6px">
        <span style="--c:var(--orange)">剛離開固體</span>
        <span style="--c:var(--blue)">回到固體上</span>
      </div>
    </div>

    <div id="chartSlot"></div>
    <div class="chartbox" id="chartbox">
      <div class="ctop">
        <div class="seg small">
          <button id="tabRate" class="on"></button>
          <button id="tabMass">溶質的量</button>
          <button id="tabTemp">溫度</button>
        </div>
        <button class="snap-sm" id="snapChart" title="把目前的圖表拍下來，放進實驗報告">📷</button>
        <button id="popBtn" title="把圖表放到獨立視窗">⧉ 獨立視窗</button>
      </div>
      <div class="chartWrap"><canvas id="chart"></canvas></div>
      <div class="legend" id="legend"></div>
      <div class="ctools">
        <div class="seg small">
          <button id="rRecent" class="on">最近 40 秒</button>
          <button id="rAll">全部紀錄</button>
        </div>
        <button id="pause">暫停</button>
      </div>
    </div>
    <p class="note" id="note"></p>
    <p class="foot" id="foot">食用色素的溶液本來就有顏色；其他物質的灰色是為了方便觀察而加上的，它們的水溶液實際上是無色透明的。</p>
    </div>
    <div id="paneReport" style="display:none;flex-direction:column;gap:12px">
    <div id="tableSlot"></div>
    <div class="tablebox" id="tablebox">
      <div class="tb-top"><b>實驗記錄表</b><button class="tb-pop" id="tbPopBtn" title="把記錄表放到獨立視窗">⧉ 獨立視窗</button></div>
      <input id="tbTitle" placeholder="幫這張表格取個名字">
      <div class="tb-scroll"><table id="recTable"></table></div>
      <div class="tb-tools">
        <button id="addCol">＋ 新增欄位</button>
        <button id="addRow">＋ 新增一列</button>
        <button id="clearTb" class="danger">清空表格</button>
      </div>
      <div class="find-label">我的發現</div>
      <textarea id="findings" placeholder="寫下你從實驗中發現了什麼，可以用表格裡的數據來說明。"></textarea>
    </div>
    <div class="photobox">
      <div class="tb-top"><b>我的照片</b><span class="hint2" id="photoCount">0 / 6 張</span></div>
      <p class="hint2">按燒杯右下角或圖表上方的「📷」拍照，照片會出現在這裡。請在每張照片下面寫說明，告訴讀報告的人這張圖在看什麼。</p>
      <div id="photoList" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>
    <button class="dl" id="dlReport">📄 下載實驗報告（Word 檔）</button>
    <p class="hint2">下載後可以用 Word、Google 文件等軟體打開，繼續完成實驗目的、步驟和討論。</p>
    </div>
  </div>
</div>

<script>
(() => {
// ================== 物質資料 ==================
// sol：溶解度（g / 100 mL 水）與溫度（°C）的對照
// gpp：每顆粒子（離子化合物為每一組正負離子）代表的質量（g）
const SUBS = {
  lactose: { name: "食用色素", unit: "色素分子", ionic: false,
    sol: [[0, 11.9], [15, 16.9], [25, 21.6], [39, 31.5], [49, 42.4], [64, 65.8], [80, 112]],
    gpp: 0.3, kd: 1, solid: "#b3261e", edge: "#6f130d", free: "#ff7d6e",
    rgb: [196, 18, 40], mac: [150, 25, 35], tint: 1, dH: 0.045 },
  sucrose: { name: "蔗糖", unit: "蔗糖分子", ionic: false,
    sol: [[0, 179], [20, 204], [40, 238], [60, 287], [80, 362]],
    gpp: 2.0, kd: 1, solid: "#a35c00", edge: "#633600", free: "#f5b041",
    rgb: [100, 106, 118], mac: [150, 155, 164], macEdge: "#8a919c", tint: 0.3, dH: 0.016 },
  nacl: { name: "食鹽", ionic: true,
    ions: [{ lab: "Na⁺", name: "鈉離子", r: 3.0, col: "#f2c230", edge: "#9a7300" },
           { lab: "Cl⁻", name: "氯離子", r: 4.4, col: "#1f9e6e", edge: "#0e5a3e" }],
    sol: [[0, 35.7], [20, 35.9], [40, 36.4], [60, 37.1], [80, 38.0]],
    gpp: 0.4, kd: 1, rgb: [100, 106, 118], mac: [150, 155, 164], macEdge: "#8a919c", tint: 0.3, dH: 0.066 },
  agcl: { name: "氯化銀", ionic: true,
    ions: [{ lab: "Ag⁺", name: "銀離子", r: 3.6, col: "#c3c9d2", edge: "#6f7782", outline: true },
           { lab: "Cl⁻", name: "氯離子", r: 4.4, col: "#1f9e6e", edge: "#0e5a3e" }],
    sol: [[0, 0.7e-4], [25, 1.9e-4], [50, 5.2e-4], [80, 1.2e-3]],
    gpp: 0.5, kd: 0.08, vis25: 4, rgb: [0, 0, 0], mac: [236, 238, 242], macEdge: "#aab1bc", tint: 0, dH: 0 },
  // 硝酸鉀：溶解度（g / 100 g 水）每 10 °C 一筆；溶解熱 +34.9 kJ/mol ÷ 101.1 g/mol ≈ +0.345 kJ/g
  kno3: { name: "硝酸鉀", ionic: true,
    ions: [{ lab: "K⁺", name: "鉀離子", r: 4.2, col: "#8e63d2", edge: "#55338f" },
           { lab: "NO₃⁻", name: "硝酸根離子", r: 4.6, col: "#e05a9c", edge: "#8f2a5d" }],
    sol: [[0, 13.3], [10, 20.9], [20, 31.6], [30, 45.8], [40, 63.9], [50, 85.5],
          [60, 110], [70, 138], [80, 169], [90, 202], [100, 246]],
    gpp: 0.8, kd: 1, rgb: [100, 106, 118], mac: [150, 155, 164], macEdge: "#8a919c", tint: 0.3,
    dH: 0.345, heat: "吸熱" },
  naoh: { name: "氫氧化鈉", ionic: true,
    ions: [{ lab: "Na⁺", name: "鈉離子", r: 3.0, col: "#f2c230", edge: "#9a7300" },
           { lab: "OH⁻", name: "氫氧根離子", r: 4.2, col: "#e0463c", edge: "#8f1f18" }],
    sol: [[0, 42], [20, 109], [40, 129], [60, 174], [80, 314], [100, 347]],
    gpp: 1.25, kd: 1, rgb: [100, 106, 118], mac: [150, 155, 164], macEdge: "#8a919c", tint: 0.3,
    dH: -1.11, heat: "放熱" }
};
// dH：每溶解 1 g 吸收的熱量（kJ）；正值 = 吸熱（變冷），負值 = 放熱（變熱）
function solAt(s, T) {
  const t = s.sol;
  if (T <= t[0][0]) return t[0][1];
  for (let i = 1; i < t.length; i++) if (T <= t[i][0]) {
    const [a, fa] = t[i - 1], [b, fb] = t[i]; return fa + (fb - fa) * (T - a) / (b - a);
  }
  return t[t.length - 1][1];
}

// ================== 基本設定 ==================
const W = 720, H = 650;
const B = { l: 180, r: 540, top: 150, bot: 560, water: 560 - 200 * 1.3 };
const R = 4, D = 8.6, DY = D * 0.866;
const COLS = Math.floor((B.r - B.l - D / 2) / D);
const colX0 = B.l + ((B.r - B.l) - (COLS * D + D / 2)) / 2 + D / 2;
const MAX_PARTICLES = 1800;
const KD = 1.3, YOUNG = 2.5, PX_ML = 1.3, VMIN = 100, VMAX = 300;
const HIST_MAX = 14400;   // 約 1 小時的紀錄

const cv = document.getElementById("sim"), ctx = cv.getContext("2d");
const ch = document.getElementById("chart"), cctx = ch.getContext("2d");

let sub = SUBS.lactose, P = 1;
let started = false;   // 第一次加入溶質後才開始計時
let device = 0;   // 1 加熱、-1 降溫、0 關閉
let mode = "bath", tempSet = 25, gDprev = 0, hotWarned = false;
let view = "macro", speed = 1, temp = 25, vol = 200, volTarget = 200, fT = 1, CsatFU = 144, paused = false;
let chartTab = "rate", chartRange = "recent", hoverX = null;
let gD = 0, gS = 0, addedG = 0, addedP = 0, satLock = false, unlockT = 0;
let free, clumps, stacks, ripples, dissEv, precEv, history, simT, stirT, pourQ, pourT, histT, field, steam;
const shaker = { x: 360, y: 72, angle: 0, shakeT: 0, next: 0 };

const waterMol = [];
function syncWaterMol() {
  const n = Math.round(vol * 0.85);
  while (waterMol.length > n) waterMol.pop();
  while (waterMol.length < n) waterMol.push({ x: B.l + Math.random() * (B.r - B.l), y: B.water + Math.random() * (B.bot - B.water), vx: 0, vy: 0 });
}
function reset() {
  free = []; clumps = []; ripples = []; dissEv = []; precEv = []; history = []; steam = [];
  stacks = Array.from({ length: COLS }, () => []);
  simT = 0; stirT = 0; pourQ = 0; pourT = 0; histT = 0;
  field = null; gD = 0; gS = 0; addedG = 0; addedP = 0;
  vol = volTarget = 200; B.water = B.bot - vol * PX_ML;
  waterMol.length = 0; syncWaterMol();
  satLock = false;
  temp = tempSet; gDprev = 0; hotWarned = false; device = 0; started = false;
}

// 飽和時水中的粒子組數（離子化合物：一組 = 一個正離子 + 一個負離子）
function calcCsat(T, V) {
  if (sub.vis25) return sub.vis25 * solAt(sub, T) / solAt(sub, 25) * V / 200;
  return solAt(sub, T) * V / 100 / sub.gpp;
}
const gppDiss = () => sub.vis25 ? solAt(sub, 25) * 2 / sub.vis25 : sub.gpp;

const siteX = (c, row) => sub.ionic ? colX0 + c * D : colX0 + c * D + (row % 2 ? D / 2 : 0) - D / 4;
const siteY = row => B.bot - 5 - row * (sub.ionic ? D : DY);
const slotType = (c, i) => (c + i) & 1;
const colOf = x => Math.max(0, Math.min(COLS - 1, Math.round((x - colX0) / D)));
const rOf = t => sub.ionic ? sub.ions[t].r : R;
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const nEvents = l => { let n = Math.floor(l); if (Math.random() < l - n) n++; return n; };

function totalCount() {
  let n = free.length;
  for (const s of stacks) n += s.length;
  for (const c of clumps) n += c.parts.length;
  return n;
}
function solidCount() {
  let n = 0;
  for (const s of stacks) for (const p of s) if (p.state === "solid") n++;
  for (const c of clumps) n += c.parts.length;
  return n;
}

// ================== 固體粒子團 ==================
function spawnClump(x, y, big) {
  if (totalCount() > MAX_PARTICLES || tooFull()) {
    if (shaker.shakeT > 0 || pourQ > 0) toast("杯底的固體已經很多了，先加水或按「重來」吧！");
    shaker.shakeT = 0; pourQ = 0; return;
  }
  const rad = big ? 2 : (Math.random() < 0.55 ? 1 : 2);
  const parts = [];
  if (sub.ionic) {           // 正負離子交錯排列的晶體
    for (let q = -rad; q <= rad; q++) for (let r = -rad; r <= rad; r++) {
      if (Math.abs(q) + Math.abs(r) > rad + 1) continue;
      if (Math.abs(q) + Math.abs(r) === rad + 1 && Math.random() < 0.4) continue;
      parts.push({ ox: q * D, oy: r * D, t: (q + r) & 1, shade: Math.random() });
    }
  } else {
    for (let q = -rad; q <= rad; q++)
      for (let r = Math.max(-rad, -q - rad); r <= Math.min(rad, -q + rad); r++) {
        if (Math.abs(q) + Math.abs(r) + Math.abs(q + r) === 2 * rad && Math.random() < 0.3) continue;
        parts.push({ ox: D * (q + r / 2), oy: DY * r, t: 0, shade: Math.random() });
      }
  }
  addedP += parts.length;
  addedG += parts.length / P * sub.gpp;
  clumps.push({ x, y, vx: (Math.random() - 0.5) * 40, vy: 40 + Math.random() * 40,
    ang: Math.random() * 6, va: (Math.random() - 0.5) * 3, parts, inWater: false });
}
function partPos(c, p) {
  const cs = Math.cos(c.ang), sn = Math.sin(c.ang);
  return { x: c.x + p.ox * cs - p.oy * sn, y: c.y + p.ox * sn + p.oy * cs };
}
// 杯底固體的高度（像素），包含還在水中下沉的固體
function pileHeight() {
  let mx = 0; for (const s of stacks) mx = Math.max(mx, s.length);
  let falling = 0; for (const c of clumps) falling += c.parts.length;
  return (mx + falling / COLS * 1.5) * (sub.ionic ? D : DY);
}
const tooFull = (depth = B.bot - B.water) => pileHeight() > depth * 0.6;
let msg = "", msgT = 0;
function toast(t) { msg = t; msgT = 2.5; }
function doShake() {
  if (tooFull()) { toast("杯底的固體已經很多了，先加水或按「重來」吧！"); bc("想再撒入溶質，但杯底固體太多被系統擋下"); return; }
  bc(`撒入了一些「${sub.name}」`, true);
  startClock();   // 撒入溶質就開始（或繼續）計時
  shaker.shakeT = 0.5; shaker.next = 0.04;
}

function releaseFree(x, y, t) {
  const a = Math.random() * Math.PI * 2;
  free.push({ x, y, t, vx: Math.cos(a) * 50, vy: Math.sin(a) * 50 - 20, flash: 0.8, age: 0 });
  dissEv.push(simT);
}
// 找一顆指定種類、離 (tx,ty) 最近的溶解粒子
function pickFree(tx, ty, t) {
  let bi = -1, bd = Infinity;
  for (let k = 0; k < 40; k++) {
    const j = Math.floor(Math.random() * free.length), f = free[j];
    if (sub.ionic && f.t !== t) continue;
    const d = (f.x - tx) ** 2 + (f.y - ty) ** 2;
    if (d < bd) { bd = d; bi = j; }
  }
  if (bi < 0) for (let j = 0; j < free.length; j++) if (!sub.ionic || free[j].t === t) { bi = j; break; }
  return bi;
}
function sendBack(c, t) {
  const L = stacks[c].length, j = pickFree(siteX(c, L), siteY(L), t);
  if (j < 0) return false;
  const f = free.splice(j, 1)[0];
  stacks[c].push({ x: f.x, y: f.y, t, state: "back", shade: Math.random() });
  return true;
}
const topSolid = c => { const s = stacks[c]; return s.length && s[s.length - 1].state === "solid"; };

// ================== 更新 ==================
function step(dt) {
  if (started) simT += dt;

  // 罐子
  if (shaker.shakeT > 0) {
    shaker.shakeT -= dt;
    shaker.angle = Math.sin(shaker.shakeT * 38) * 0.32 * Math.min(1, shaker.shakeT * 4);
    shaker.next -= dt;
    if (shaker.next <= 0) { spawnClump(shaker.x + (Math.random() - 0.5) * 30, shaker.y + 66, false); shaker.next = 0.13; }
  } else shaker.angle *= 0.8;
  if (pourQ > 0) {
    pourT -= dt; shaker.angle = 0.25 * Math.sin(simT * 30);
    if (pourT <= 0) { spawnClump(shaker.x + (Math.random() - 0.5) * 36, shaker.y + 66, true); pourQ--; pourT = 0.06; }
  }
  if (stirT > 0) stirT -= dt;

  // 水量與溫度
  if (vol !== volTarget) {
    const evaporating = volTarget < vol;
    vol += Math.sign(volTarget - vol) * Math.min(Math.abs(volTarget - vol), (evaporating ? 25 : 60) * dt);
    B.water = B.bot - vol * PX_ML;
    syncWaterMol();
    if (evaporating && Math.random() < dt * 25) steam.push({ x: B.l + 20 + Math.random() * (B.r - B.l - 40), y: B.water - 4, t: 0 });
  }
  for (let i = steam.length - 1; i >= 0; i--) { const w = steam[i]; w.t += dt; w.y -= 30 * dt; if (w.t > 1.6) steam.splice(i, 1); }
  CsatFU = calcCsat(temp, vol);
  fT = Math.max(0.3, 0.6 + 0.016 * temp);
  const K = KD * fT * sub.kd;

  // 粒子團下落
  for (let i = clumps.length - 1; i >= 0; i--) {
    const c = clumps[i];
    if (!c.inWater) c.vy += 900 * dt;
    else { c.vy += (85 - c.vy) * Math.min(1, dt * 3); c.vx *= (1 - dt * 1.5); c.va *= (1 - dt); }
    c.x += c.vx * dt; c.y += c.vy * dt; c.ang += c.va * dt;
    c.x = Math.max(B.l + 22, Math.min(B.r - 22, c.x));
    if (!c.inWater && c.y > B.water) { c.inWater = true; c.vy *= 0.3; ripples.push({ x: c.x, t: 0 }); }
    if (!c.parts.length) { clumps.splice(i, 1); continue; }
    let landed = false;
    const pos = c.parts.map(p => ({ p, ...partPos(c, p) }));
    for (const q of pos) if (q.y >= siteY(stacks[colOf(q.x)].length)) { landed = true; break; }
    if (landed) {
      pos.sort((a, b) => b.y - a.y);
      for (const q of pos) stacks[colOf(q.x)].push({ x: q.x, y: q.y, t: q.p.t, state: "solid", shade: q.p.shade });
      clumps.splice(i, 1);
    }
  }

  // 沉澱堆
  for (let c = 0; c < COLS; c++) {
    const s = stacks[c];
    for (let i = 0; i < s.length; i++) {
      const p = s[i], tx = siteX(c, i), ty = siteY(i);
      if (p.state === "solid") {
        const k = Math.min(1, dt * 10); p.x += (tx - p.x) * k; p.y += (ty - p.y) * k;
      } else {
        const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
        const v = 130 + 60 * Math.min(1, d / 100);
        if (d < v * dt + 0.5) { p.x = tx; p.y = ty; p.state = "solid"; p.flash = 0.8; precEv.push(simT); }
        else { p.x += dx / d * v * dt + gauss() * 0.6; p.y += dy / d * v * dt + gauss() * 0.6; }
      }
      if (p.flash > 0) p.flash -= dt;
    }
  }
  // 堆積崩落
  const need = sub.ionic ? 3 : 2, move = sub.ionic ? 2 : 1;
  for (let c = 0; c < COLS; c++) for (const n of [c - 1, c + 1]) {
    if (n < 0 || n >= COLS) continue;
    const s = stacks[c];
    if (s.length - stacks[n].length < need) continue;
    let ok = true; for (let k = 1; k <= move; k++) if (s[s.length - k].state !== "solid") ok = false;
    if (ok) for (let k = 0; k < move; k++) stacks[n].push(s.pop());
  }

  // ===== 溶解與析出 =====
  // 先用「理論上會不會飽和」決定方向：
  // 水中（溶解的 + 水裡的固體）的總量還不到飽和量 → 最後一定會全部溶解，析出幾乎不發生；
  // 接近或超過飽和量 → 析出才正常進行，形成動態平衡。
  const tops = [];
  for (let c = 0; c < COLS; c++) if (topSolid(c)) tops.push(c);
  let backNow = 0; for (const s of stacks) for (const p of s) if (p.state === "back") backNow++;
  const dissFUnow = (free.length + backNow) / P;   // 水中的溶質（包含正在游回固體的粒子）
  let pileAll = 0; for (const s of stacks) pileAll += s.length;
  let wetAll = 0; for (const c of clumps) if (c.inWater) wetAll += c.parts.length;
  const totalFU = (free.length + pileAll + wetAll) / P;
  const theo = totalFU / CsatFU;                       // 理論上的「飽和程度」
  const precipFactor = theo < 0.92 ? 0.01 : theo < 1 ? 0.01 + 0.99 * (theo - 0.92) / 0.08 : 1;
  let clumpS = 0;
  for (const c of clumps) if (c.inWater && c.parts.length) clumpS += Math.ceil(c.parts.length * 0.3) * Math.max(0, 1 - dissFUnow / CsatFU);
  const S = tops.length + clumpS;
  // 離子化合物：放出離子時，補水中比較少的那一種，讓正負離子數保持一樣
  const lessType = () => { let n0 = 0; for (const f of free) if (f.t === 0) n0++; return n0 <= free.length - n0 ? 0 : 1; };

  // 溶解（每次事件：一個分子，或一組正負離子）
  let nd = nEvents(K * S * dt);
  while (nd-- > 0) {
    if (Math.random() * S < tops.length && tops.length) {
      const c = tops[Math.floor(Math.random() * tops.length)];
      if (!topSolid(c)) continue;
      const s = stacks[c];
      if (!sub.ionic) { const q = s.pop(); releaseFree(q.x, q.y - 2, 0); continue; }
      const t1 = slotType(c, s.length - 1);
      let c2 = -1;
      if (s.length >= 2 && s[s.length - 2].state === "solid") c2 = c;
      else for (let d = 1; d < COLS && c2 < 0; d++) for (const cc of [c - d, c + d])
        if (cc >= 0 && cc < COLS && topSolid(cc)) { c2 = cc; break; }
      const a = s.pop(); releaseFree(a.x, a.y - 2, c2 < 0 ? lessType() : t1);
      if (c2 >= 0) { const b = stacks[c2].pop(); releaseFree(b.x, b.y - 2, 1 - t1); }
    } else {
      const inw = clumps.filter(c => c.inWater && c.parts.length);
      if (!inw.length) continue;
      const cl = inw[Math.floor(Math.random() * inw.length)];
      const n = Math.min(P, cl.parts.length);
      for (let k = 0; k < n; k++) {
        let bi = 0, bd = -1;
        for (let j = 0; j < cl.parts.length; j++) { const d = cl.parts[j].ox ** 2 + cl.parts[j].oy ** 2 + Math.random() * 30; if (d > bd) { bd = d; bi = j; } }
        const pp = partPos(cl, cl.parts[bi]); cl.parts.splice(bi, 1);
        releaseFree(pp.x, pp.y, !sub.ionic ? 0 : n === 2 ? k : lessType());
      }
    }
  }
  // 過飽和：杯底長出新的小晶體（固體很少時）
  if (tops.length < 6 && !clumps.length && theo > 1.03 && dissFUnow > CsatFU * 1.03 && Math.random() < dt * 3) {
    const c = Math.floor(COLS / 2 + (Math.random() - 0.5) * COLS * 0.6);
    sendBack(c, slotType(c, stacks[c].length));
    if (sub.ionic) sendBack(c, slotType(c, stacks[c].length));
  }
  // 析出：速率 = k × 暴露表面 × (水中的量 / 飽和量) × 方向係數
  if (tops.length && free.length >= P) {
    const over = Math.max(0, dissFUnow / CsatFU - 1);           // 過飽和越多，析出越快
    let np = nEvents(K * tops.length * dt * dissFUnow / CsatFU * precipFactor * (1 + 2 * over));
    while (np-- > 0 && free.length >= P) {
      const c = tops[Math.floor(Math.random() * tops.length)];
      sendBack(c, slotType(c, stacks[c].length));
      if (sub.ionic) sendBack(c, slotType(c, stacks[c].length));
    }
  }

  // 溶解粒子的運動
  const cx = (B.l + B.r) / 2, cy = (B.water + B.bot) / 2, stir = Math.max(0, stirT) / 3;
  const tau = 0.8, sq = Math.sqrt(2 * dt / tau) * 48 * Math.sqrt(fT);
  for (const p of free) {
    p.vx += -p.vx * dt / tau + sq * gauss();
    p.vy += -p.vy * dt / tau + sq * gauss();
    let fx = 0, fy = 0;
    if (stir > 0) { const dx = p.x - cx, dy = p.y - cy, d = Math.hypot(dx, dy) + 20; fx = -dy / d * 170 * stir; fy = dx / d * 170 * stir; }
    p.x += (p.vx + fx) * dt; p.y += (p.vy + fy) * dt;
    if (p.x < B.l + R) { p.x = B.l + R; p.vx = Math.abs(p.vx); }
    if (p.x > B.r - R) { p.x = B.r - R; p.vx = -Math.abs(p.vx); }
    if (p.y < B.water + R) { p.y = B.water + R; p.vy = Math.abs(p.vy); }
    const fl = siteY(stacks[colOf(p.x)].length) + 2;
    if (p.y > fl) { p.y = fl; p.vy = -Math.abs(p.vy); }
    if (p.flash > 0) p.flash -= dt;
    p.age += dt;
  }
  if (view === "micro") for (const m of waterMol) {
    m.vx += -m.vx * dt / 0.3 + Math.sqrt(2 * dt / 0.3) * 60 * gauss();
    m.vy += -m.vy * dt / 0.3 + Math.sqrt(2 * dt / 0.3) * 60 * gauss();
    m.x += m.vx * dt; m.y += m.vy * dt;
    if (m.x < B.l + 2 || m.x > B.r - 2) { m.vx *= -1; m.x = Math.max(B.l + 2, Math.min(B.r - 2, m.x)); }
    if (m.y < B.water + 2 || m.y > B.bot - 2) { m.vy *= -1; m.y = Math.max(B.water + 2, Math.min(B.bot - 2, m.y)); }
  }
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 1) ripples.splice(i, 1); }

  // 巨觀讀數：穩定的重量
  let backN = 0, pileN = 0;
  for (const s of stacks) for (const p of s) { pileN++; if (p.state === "back") backN++; }
  let wetClump = 0; for (const c of clumps) if (c.inWater) wetClump += c.parts.length;
  const dissFU = (free.length + backN) / P;
  const hasSolid = pileN - backN + wetClump > 0;
  const band = sub.vis25 ? CsatFU + 50 : Math.max(CsatFU * 0.12, 3);   // 難溶物質：有固體就視為飽和
  // 鎖定飽和讀數：一旦接近飽和就固定顯示飽和量，直到條件明顯改變（加熱、降溫、加水、固體溶完）
  if (!hasSolid || theo < 1) satLock = false;
  else if (Math.abs(dissFU - CsatFU) < band) { satLock = true; unlockT = 0; }
  else if (Math.abs(dissFU - CsatFU) > 3 * band) { unlockT += dt; if (unlockT > 1.5) satLock = false; }   // 持續偏離才解除
  else unlockT = 0;
  const targetFU = satLock ? CsatFU : dissFU;
  const targetG = Math.min(targetFU * gppDiss(), addedG);
  gD += (targetG - gD) * Math.min(1, dt / 0.8);
  if (Math.abs(targetG - gD) < Math.max(targetG, 1e-6) * 0.001) gD = targetG;
  gS = Math.max(0, addedG - gD);

  // 外部加熱／降溫
  if (device) {
    if (mode === "bath") {             // 調整水浴的溫度
      tempSet += device * 3 * dt;
      if (tempSet >= 80 || tempSet <= 0) { tempSet = Math.max(0, Math.min(80, tempSet)); device = 0; toast(tempSet >= 80 ? "水浴已經到最高溫度 80 °C" : "水浴已經到最低溫度 0 °C"); bc(`加熱／降溫裝置自動停止：水浴已到${tempSet >= 80 ? "最高溫度 80" : "最低溫度 0"} °C`, true); }
      temp = tempSet;
      const sv = Math.round(tempSet); if (+$("temp").value !== sv) $("temp").value = sv;
    } else {                           // 直接加熱或冷卻隔熱杯中的溶液
      temp += device * 1.5 * dt / ((vol + gD) * 0.00418);
      if (temp >= 100) { temp = 100; device = 0; toast("溶液已經加熱到 100 °C，停止加熱"); bc("加熱／降溫裝置自動停止：溶液已加熱到 100 °C", true); }
      if (temp <= -15) { temp = -15; device = 0; toast("已經降到 −15 °C，停止降溫"); bc("加熱／降溫裝置自動停止：溶液已降到 −15 °C", true); }
    }
  }
  // 溶解熱：隔熱杯中，溶解（或析出）的熱量改變溶液溫度
  const dG = gD - gDprev; gDprev = gD;
  if (mode === "insul" && sub.dH && dG) {
    const C = (vol + gD) * 0.00418;                 // 溶液的熱容量（kJ/°C），以水的比熱估算
    temp -= sub.dH * dG / C;
    if (temp > 100) { temp = 100; if (!hotWarned) { toast("溶液的溫度已經接近沸點了！"); hotWarned = true; } }
    if (temp < -15) temp = -15;
  }

  // 紀錄
  while (dissEv.length && dissEv[0] < simT - 3) dissEv.shift();
  while (precEv.length && precEv[0] < simT - 3) precEv.shift();
  histT -= dt;
  if (histT <= 0 && !started) { histT = 0.25; updatePanel(); }
  if (histT <= 0) {
    histT = 0.25;
    const rd = dissEv.filter(t => t > simT - 2).length / 2, rp = precEv.filter(t => t > simT - 2).length / 2;
    history.push({ t: simT, d: rd, p: rp, pct: pctOf(gD), add: addedG, dis: gD, und: gS,
      addN: addedP, disN: free.length + backN, undN: solidCount(),
      dissFU, band, theo, temp, satLock, hasPile: pileN - backN > 0 });
    if (history.length > HIST_MAX) history.shift();
    updatePanel();
  }
}

// 巨觀：整杯均勻的顏色，剛溶解的地方短暫較深
const GW = 36, GH = 26;
const off = document.createElement("canvas"); off.width = GW; off.height = GH;

const pctOf = g => g / (g + vol) * 100;
function drawField() {
  if (!sub.tint) return;
  const g = new Float32Array(GW * GH);
  const unsat = Math.max(0, 1 - free.length / P / CsatFU);
  const add = (x, y, w0) => {
    const gx = (x - B.l) / (B.r - B.l) * GW - 0.5, gy = (y - B.water) / (B.bot - B.water) * GH - 0.5;
    const x0 = Math.floor(gx), y0 = Math.floor(gy), fx = gx - x0, fy = gy - y0;
    for (const [dx, dy, w] of [[0, 0, (1 - fx) * (1 - fy)], [1, 0, fx * (1 - fy)], [0, 1, (1 - fx) * fy], [1, 1, fx * fy]]) {
      const X = Math.max(0, Math.min(GW - 1, x0 + dx)), Y = Math.max(0, Math.min(GH - 1, y0 + dy));
      g[Y * GW + X] += w * w0;
    }

  if (unsat > 0) for (const p of free) if (p.age < YOUNG) add(p.x, p.y, 3 * (1 - p.age / YOUNG) * unsat);

  for (let pass = 0; pass < 4; pass++) {
    const b = new Float32Array(GW * GH);
    for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
      let s = 0, n = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const X = x + dx, Y = y + dy; if (X < 0 || Y < 0 || X >= GW || Y >= GH) continue; s += a[Y * GW + X]; n++;

  else for (let i = 0; i < a.length; i++) field[i] = field[i] * 0.8 + a[i] * 0.2;

// ================== 數字格式 ==================
const fmtT = t => (mode === "bath" ? Math.round(t).toString() : t.toFixed(1)) + " °C";
function fmtG(g) {
  if (g < 1e-6) return "0 g";
  if (g >= 0.1) return g.toFixed(1) + " g";
  return (g * 1000).toFixed(2) + " mg";
}
function fmtPct(p) {
  if (p <= 0) return "0%";
  if (p >= 0.1) return p.toFixed(1) + "%";
  return Number(p.toPrecision(2)) + "%";
}
function fmtNum(v) {
  if (v === 0) return "0";
  if (Math.abs(v) >= 10) return Math.round(v).toString();
  if (Math.abs(v) >= 1) return (+v.toFixed(1)).toString();
  return Number(v.toPrecision(2)).toString();
}
function niceMax(v) {
  if (v <= 0) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(v))), m = v / e;
  return ([1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].find(k => m <= k + 1e-9)) * e;
}

// ================== 圖表 ==================
function chartDef() {

    ? { unit: "%", fmt: fmtPct, s: [{ k: "pct", name: "重量百分濃度", col: "#c62834" }] }

    ? { unit: "g", fmt: fmtG, s: [{ k: "add", name: "加入的溶質", col: "#475467" }, { k: "dis", name: "溶解的溶質", col: "#e8742a" }, { k: "und", name: "未溶解的溶質", col: "#8b5e34" }] }
    : { unit: "粒子", fmt: v => Math.round(v).toString(), s: [{ k: "addN", name: "加入的粒子", col: "#475467" }, { k: "disN", name: "溶在水中的粒子", col: "#e8742a" }, { k: "undN", name: "未溶解的粒子", col: "#8b5e34" }] };
}
function updateLegend() {

  document.getElementById("tabRate").textContent = view === "macro" ? "濃度" : "溶解與析出速率";

function drawChart() {
  const w = ch.clientWidth, h = ch.clientHeight, dpr = window.devicePixelRatio || 1;
  if (ch.width !== Math.round(w * dpr) || ch.height !== Math.round(h * dpr)) { ch.width = Math.round(w * dpr); ch.height = Math.round(h * dpr); }
  cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cctx.clearRect(0, 0, w, h);
  const def = chartDef();
  const pl = 44, pr = 10, pt = 22, pb = 22, iw = w - pl - pr, ih = h - pt - pb;
  const tEnd = history.length ? history[history.length - 1].t : 0;
  let t0, t1;
  if (chartRange === "recent") { t1 = Math.max(40, tEnd); t0 = t1 - 40; }
  else { t0 = 0; t1 = Math.max(40, tEnd); }
  let lo = 0, hi = history.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (history[m].t < t0) lo = m + 1; else hi = m; }
  const data = history.slice(lo);
  const stepN = Math.max(1, Math.ceil(data.length / (iw * 1.5)));
  let mx = 0, mn = 0; for (const e of data) for (const s of def.s) { mx = Math.max(mx, e[s.k]); mn = Math.min(mn, e[s.k]); }
  { // 讓 4 個刻度間隔都是整齊的數字
    const raw = (mx * 1.1 || 1) / 4, e = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / e;
    mx = 4 * [1, 2, 2.5, 5, 10].find(k => m <= k + 1e-9) * e;
  }
  if (chartTab === "rate" && view === "micro") mx = Math.max(mx, 10);
  if (chartTab === "temp") {
    let hiT = 0; for (const e of data) hiT = Math.max(hiT, e.temp);
    mn = mn < 0 ? -20 : 0;
    const stepT = Math.max(10, Math.ceil((Math.max(hiT * 1.05, 40) - mn) / 40) * 10);
    mx = mn + 4 * stepT;
  }
  const X = t => pl + iw * (t - t0) / (t1 - t0), Y = v => pt + ih - (v - mn) / (mx - mn) * ih;

  cctx.font = "10px sans-serif"; cctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const v = mn + (mx - mn) * i / 4, y = Y(v);
    cctx.strokeStyle = "#eceff4"; cctx.beginPath(); cctx.moveTo(pl, y); cctx.lineTo(w - pr, y); cctx.stroke();
    cctx.fillStyle = "#98a2b3"; cctx.textAlign = "right"; cctx.fillText(fmtNum(v), pl - 5, y + 3);
  }
  cctx.textAlign = "left"; cctx.fillStyle = "#667085"; cctx.fillText("單位：" + def.unit, pl, 10);
  const span = t1 - t0, steps = [5, 10, 20, 30, 60, 120, 300, 600, 1200];
  const ts = steps.find(s => span / s <= 5) || 1200;
  cctx.textAlign = "center"; cctx.fillStyle = "#98a2b3";
  for (let t = Math.ceil(t0 / ts) * ts; t <= t1 + 0.01; t += ts) {
    const x = X(t);
    cctx.strokeStyle = "#e3e7ef"; cctx.beginPath(); cctx.moveTo(x, pt + ih); cctx.lineTo(x, pt + ih + 4); cctx.stroke();
    cctx.fillText(t >= 120 && ts >= 60 ? (t / 60) + " 分" : t + " 秒", x, h - 6);
  }
  cctx.strokeStyle = "#cfd5df"; cctx.beginPath(); cctx.moveTo(pl, pt + ih); cctx.lineTo(w - pr, pt + ih); cctx.stroke();

  for (const s of def.s) {
    cctx.strokeStyle = s.col; cctx.lineWidth = 2; cctx.beginPath();

  // 游標讀值

    const x = X(best.t);
    cctx.strokeStyle = "rgba(29,36,51,0.35)"; cctx.lineWidth = 1; cctx.setLineDash([3, 3]);
    cctx.beginPath(); cctx.moveTo(x, pt); cctx.lineTo(x, pt + ih); cctx.stroke(); cctx.setLineDash([]);
    for (const s of def.s) { cctx.fillStyle = s.col; cctx.beginPath(); cctx.arc(x, Y(best[s.k]), 3, 0, 7); cctx.fill(); }
    const lines = [`${best.t.toFixed(1)} 秒`, ...def.s.map(s => `${s.name}：${def.fmt(best[s.k])}`)];
    cctx.font = "11px sans-serif";
    const bw = Math.max(...lines.map(l => cctx.measureText(l).width)) + 14, bh = lines.length * 15 + 8;
    let bx = x + 8; if (bx + bw > w - 2) bx = x - bw - 8;
    const by = pt + 2;
    cctx.fillStyle = "rgba(255,255,255,0.95)"; cctx.strokeStyle = "#d0d5dd";
    cctx.beginPath(); cctx.rect(bx, by, bw, bh); cctx.fill(); cctx.stroke();
    cctx.textAlign = "left";
    lines.forEach((l, i) => { cctx.fillStyle = i ? def.s[i - 1].col : "#1d2433"; cctx.fillText(l, bx + 7, by + 15 + i * 15); });
  }
}

  if (gD > satG * 1.05) return "過飽和（溶質正在析出）";

let settlePending = false, settleN = 0, settleLastG = -1, settleLastT = -99, settleStart = 0;
function markAction() { settlePending = true; settleN = 0; settleLastG = -1; settleStart = performance.now(); }
setInterval(() => {

  if (!busy && Math.abs(gD - settleLastG) < 0.05 && Math.abs(temp - settleLastT) < 0.05) settleN++; else settleN = 0;
  settleLastG = gD; settleLastT = temp;
  const timedOut = performance.now() - settleStart > 45000;
  if (settleN >= 3 || timedOut) {
    settlePending = false;
    bc(timedOut && settleN < 3 ? "【自動】操作後 45 秒，讀數仍在變化中" : "【自動】操作後讀數已穩定");
  }
}, 1000);

let last = performance.now();
function loop(now) {
  const real = Math.min(0.05, (now - last) / 1000); last = now;
  if (msgT > 0) msgT -= real;
  if (!paused) {
    let dt = real * speed;
    while (dt > 0) { const h = Math.min(dt, 1 / 60); step(h); dt -= h; }
  }
  draw(); drawChart();
  requestAnimationFrame(loop);
}

<script>
// 獨立視窗：可拖曳、可調整大小（圖表、實驗記錄表各一個）
(() => {
  function makeFloat(winId, boxId, slotId, btnId, label, offset) {
    const win = document.getElementById(winId), body = win.querySelector(".fw-body");
    const box = document.getElementById(boxId), slot = document.getElementById(slotId), btn = document.getElementById(btnId);
    const clamp = () => {
      const r = win.getBoundingClientRect();
      win.style.left = Math.max(0, Math.min(innerWidth - 80, r.left)) + "px";
      win.style.top = Math.max(0, Math.min(innerHeight - 40, r.top)) + "px";
    };
    btn.onclick = () => {
      if (!win.hidden) return;
      const w = Math.min(640, innerWidth - 32), h = Math.min(440, innerHeight - 32);
      win.style.width = w + "px"; win.style.height = h + "px";
      win.style.left = Math.max(16, (innerWidth - w) / 2 + offset) + "px"; win.style.top = Math.max(16, (innerHeight - h) / 3 + offset) + "px";
      body.appendChild(box); win.hidden = false; btn.style.display = "none";
      window.__simBroadcast && window.__simBroadcast(`把${label}移到獨立視窗`);
    };
    win.querySelector(".fw-close").onclick = () => {
      slot.after(box); win.hidden = true; btn.style.display = "";
      window.__simBroadcast && window.__simBroadcast(`把${label}放回面板`);
    };
    win.addEventListener("pointerdown", () => {   // 點到的視窗放到最上層
      document.querySelectorAll(".floatwin").forEach(x => x.style.zIndex = 50); win.style.zIndex = 51;
    });
    const drag = (el, onMove) => el.addEventListener("pointerdown", e => {
      if (e.target.tagName === "BUTTON") return;
      e.preventDefault(); el.setPointerCapture(e.pointerId);
      const r = win.getBoundingClientRect(), sx = e.clientX, sy = e.clientY;
      const mv = ev => onMove(r, ev.clientX - sx, ev.clientY - sy);
      const up = () => { el.removeEventListener("pointermove", mv); el.removeEventListener("pointerup", up); clamp(); };
      el.addEventListener("pointermove", mv); el.addEventListener("pointerup", up);
    });
    drag(win.querySelector(".fw-bar"), (r, dx, dy) => { win.style.left = r.left + dx + "px"; win.style.top = r.top + dy + "px"; });
    drag(win.querySelector(".fw-resize"), (r, dx, dy) => {
      win.style.width = Math.max(320, Math.min(innerWidth - r.left, r.width + dx)) + "px";
      win.style.height = Math.max(220, Math.min(innerHeight - r.top, r.height + dy)) + "px";
    });
    addEventListener("resize", () => { if (!win.hidden) clamp(); });
  }
  makeFloat("floatWin", "chartbox", "chartSlot", "popBtn", "圖表", 0);
  makeFloat("floatWin2", "tablebox", "tableSlot", "tbPopBtn", "記錄表", 40);
})();
</script>
