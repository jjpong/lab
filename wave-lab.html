<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>波動實驗台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2324372e'/><path d='M8.0,32.0 L9.2,29.0 L10.4,26.1 L11.6,23.6 L12.8,21.5 L14.0,20.0 L15.2,19.2 L16.4,19.0 L17.6,19.6 L18.8,20.9 L20.0,22.8 L21.2,25.2 L22.4,28.0 L23.6,31.0 L24.8,34.0 L26.0,37.0 L27.2,39.6 L28.4,41.9 L29.6,43.6 L30.8,44.6 L32.0,45.0 L33.2,44.6 L34.4,43.6 L35.6,41.9 L36.8,39.6 L38.0,37.0 L39.2,34.0 L40.4,31.0 L41.6,28.0 L42.8,25.2 L44.0,22.8 L45.2,20.9 L46.4,19.6 L47.6,19.0 L48.8,19.2 L50.0,20.0 L51.2,21.5 L52.4,23.6 L53.6,26.1 L54.8,29.0 L56.0,32.0' fill='none' stroke='%23eef1e8' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/><circle cx='24' cy='19' r='5' fill='%23ff7a6a'/></svg>">
<meta name="description" content="用繩子、彈簧、喇叭和水波槽觀察橫波、縱波、聲波、反射、駐波與水波干涉。">
<meta name="category" content="波動與聲音">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: a framed chalkboard is the stage; playback sits on its tray, control cards wrap in an auto-fit grid below */
:root{
  --bg:#e8ebe4;
  --panel:#f8f9f5;
  --fg:#1b2420;
  --muted:#5a675f;
  --line:#cad2c7;
  --accent:#2d6a4c;
  --accent-fg:#ffffff;
  --accent-soft:#d9e8de;
  --wood:#8a6943;
  --wood-edge:#5f4529;
  --chip:#e3e8e0;
  --f-display:"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai","DFKai-SB",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111714; --panel:#19211d; --fg:#e4eae3; --muted:#9aa89f; --line:#2c3933;
    --accent:#79c09a; --accent-fg:#0f1a14; --accent-soft:#223a2e;
    --wood:#6a5034; --wood-edge:#3e2d1b; --chip:#232d28; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111714; --panel:#19211d; --fg:#e4eae3; --muted:#9aa89f; --line:#2c3933;
  --accent:#79c09a; --accent-fg:#0f1a14; --accent-soft:#223a2e;
  --wood:#6a5034; --wood-edge:#3e2d1b; --chip:#232d28; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
.app{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:14px 28px;display:flex;flex-direction:column;gap:14px;background:var(--bg)}
.app:fullscreen{max-width:none;overflow:auto;padding-inline:24px}

.top{display:flex;align-items:center;gap:14px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-right:auto}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:1.9rem;line-height:1.1;margin:0;letter-spacing:.04em;text-wrap:balance}
.brand p{margin:0;color:var(--muted);font-size:.92rem;letter-spacing:.12em}
.tabs{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:12px}
.tabs button{font:inherit;font-family:var(--f-display);font-size:1.12rem;font-weight:700;border:0;background:transparent;color:var(--muted);padding:7px 18px;border-radius:9px;cursor:pointer;min-height:42px}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ghost{font:inherit;font-size:.9rem;border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 14px;border-radius:9px;cursor:pointer;min-height:40px}
.ghost:hover{color:var(--fg)}

.stage{display:flex;flex-direction:column;gap:0}
.frame{border:10px solid var(--wood);border-bottom-width:14px;border-radius:8px;background:#24372e;box-shadow:inset 0 0 0 1px var(--wood-edge),0 2px 0 var(--wood-edge)}
#board{display:block;width:100%;height:clamp(270px,52vh,560px);touch-action:pan-y}
#board.grab{touch-action:none;cursor:grab}
#board.grab:active{cursor:grabbing}
#board.tap{cursor:pointer}
.app:fullscreen #board{height:62vh}

.playbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-block:10px 0}
.playbar button{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:8px 16px;border-radius:9px;cursor:pointer;min-height:42px}
.playbar button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);min-width:88px}
.playbar button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.playbar button.pulse{background:#c9772f;border-color:#c9772f;color:#fff;font-weight:700}
.hint{color:var(--muted);font-size:.92rem;min-width:0}

.info{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.info .vals{display:flex;flex-wrap:wrap;gap:6px 22px;font-variant-numeric:tabular-nums}
.info .vals span b{font-weight:700}
.info .vals span i{font-style:normal;color:var(--muted);margin-right:4px}
.info .law{font-family:var(--f-display);font-size:1.05rem}
.info .note{color:var(--muted);font-size:.88rem}

.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font-size:.8rem;letter-spacing:.14em;color:var(--muted);font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.tog{font:inherit;font-size:.95rem;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:7px 12px;border-radius:9px;cursor:pointer;min-height:40px;flex:1 1 auto}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.tog{flex:0 1 auto;display:inline-flex;align-items:center;gap:7px}
.tog::before{content:"";width:14px;height:14px;border-radius:4px;border:1.5px solid var(--muted);flex:none}
.tog[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tog[aria-pressed="true"]::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent-soft)}
.togs{display:flex;flex-wrap:wrap;gap:6px}
.endrow{display:flex;flex-direction:column;gap:5px}
.endrow>span{font-weight:500}
.sl{display:flex;flex-direction:column;gap:2px}
.sl label{display:flex;justify-content:space-between;align-items:baseline;font-weight:500}
.sl input{width:100%;accent-color:var(--accent);height:28px;margin:0}
.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:.82rem}
.num{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700;font-size:.9rem}
.small{color:var(--muted);font-size:.85rem;margin:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:560px){
  .brand h1{font-size:1.55rem}
  .tabs{width:100%}
  .tabs button{flex:1;padding:7px 6px}
  .frame{border-width:7px;border-bottom-width:10px}
}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><h1>波動實驗台</h1><p>橫波・縱波・聲波・水波</p></div>
    <nav class="tabs" role="tablist" aria-label="選擇介質">
      <button role="tab" id="tab-rope" data-tab="rope" aria-selected="true">繩子</button>
      <button role="tab" id="tab-spring" data-tab="spring" aria-selected="false">彈簧</button>
      <button role="tab" id="tab-sound" data-tab="sound" aria-selected="false">聲音</button>
      <button role="tab" id="tab-water" data-tab="water" aria-selected="false">水波</button>
    </nav>
    <button class="ghost" id="fs" type="button">全螢幕</button>
  </header>

  <section class="stage">
    <div class="frame"><canvas id="board" aria-label="波動模擬黑板"></canvas></div>
    <div class="playbar">
      <button id="play" class="primary" type="button">暫停</button>
      <button id="slow" type="button" aria-pressed="false">慢動作</button>
      <button id="reset" type="button">清除重來</button>
      <button id="pulseL" class="pulse" type="button" hidden>送出一個脈衝</button>
      <button id="pulseR" class="pulse" type="button" hidden>右邊送出脈衝</button>
      <button id="pulseB" class="pulse" type="button" hidden>兩邊同時送出</button>
      <span id="hint" class="hint"></span>
    </div>
    <div id="info" class="info" hidden></div>
  </section>

  <section class="controls">
    <div class="card">
      <h2>振動方式</h2>
      <div class="seg" id="mode" role="group" aria-label="振動方式">
        <button type="button" data-v="cont">連續振動</button>
        <button type="button" data-v="pulse">單一脈衝</button>
        <button type="button" data-v="manual" id="manualBtn">手動拖曳</button>
      </div>
      <div class="seg" id="dir" data-for="spring" role="group" aria-label="抖動方向">
        <button type="button" data-v="trans">上下抖動</button>
        <button type="button" data-v="long">前後推拉</button>
        <button type="button" data-v="free" id="dirFree">自由振動</button>
      </div>
    </div>

    <div class="card">
      <h2>波源</h2>
      <div class="sl">
        <label for="amp"><span id="ampName">振幅</span></label>
        <input type="range" id="amp" min="0.1" max="1" step="0.01">
        <div class="ends"><span>小</span><span>大</span></div>
      </div>
      <div class="sl">
        <label for="freq"><span id="freqName">頻率</span><output id="freqNum" class="num" hidden></output></label>
        <input type="range" id="freq" min="0.3" max="1.5" step="0.01">
        <div class="ends"><span id="freqLo">慢</span><span id="freqHi">快</span></div>
      </div>
    </div>

    <div class="card" data-for="rope spring">
      <h2>兩端</h2>
      <div class="endrow"><span>左端</span>
        <div class="seg" id="endL" role="group" aria-label="左端">
          <button type="button" data-v="none">不接（延伸很遠）</button>
          <button type="button" data-v="held">固定</button>
          <button type="button" data-v="src">波源</button>
        </div>
      </div>
      <div class="endrow"><span>右端</span>
        <div class="seg" id="endR" role="group" aria-label="右端">
          <button type="button" data-v="none">不接（延伸很遠）</button>
          <button type="button" data-v="held">固定</button>
          <button type="button" data-v="src">波源</button>
        </div>
      </div>
      <div class="togs"><button type="button" class="tog" id="invR" aria-pressed="false">右邊波源反向振動</button></div>
      <p class="small" id="endNote"></p>
    </div>

    <div class="card" data-for="rope">
      <h2>繩子</h2>
      <div class="seg" id="ropeType" role="group" aria-label="繩子種類">
        <button type="button" data-v="0">細棉繩</button>
        <button type="button" data-v="1">粗麻繩</button>
        <button type="button" data-v="2">鐵鍊</button>
      </div>
      <div class="sl">
        <label for="ropeT">張力（拉多緊）</label>
        <input type="range" id="ropeT" min="2" max="10" step="0.1">
        <div class="ends"><span>鬆</span><span>緊</span></div>
      </div>
    </div>

    <div class="card" data-for="spring">
      <h2>彈簧</h2>
      <div class="seg" id="springType" role="group" aria-label="彈簧種類">
        <button type="button" data-v="0">塑膠彈簧</button>
        <button type="button" data-v="1">細金屬</button>
        <button type="button" data-v="2">粗金屬</button>
      </div>
      <div class="sl">
        <label for="springT">張力（拉多長）</label>
        <input type="range" id="springT" min="2" max="10" step="0.1">
        <div class="ends"><span>鬆</span><span>緊</span></div>
      </div>
    </div>

    <div class="card" data-for="sound">
      <h2>介質與視角</h2>
      <div class="seg" id="view" role="group" aria-label="視角">
        <button type="button" data-v="macro">巨觀（整體）</button>
        <button type="button" data-v="micro">微觀（粒子）</button>
      </div>
      <div class="seg" id="medium" role="group" aria-label="介質">
        <button type="button" data-v="air">空氣</button>
        <button type="button" data-v="water">水</button>
        <button type="button" data-v="steel">鋼鐵</button>
        <button type="button" data-v="vacuum">真空</button>
      </div>
      <div class="sl" id="thermalBox">
        <label for="thermal">粒子熱運動</label>
        <input type="range" id="thermal" min="0" max="1" step="0.01">
        <div class="ends"><span>平靜</span><span>劇烈（較接近真實）</span></div>
      </div>
      <div class="togs">
        <button type="button" class="tog" id="audio" aria-pressed="false">播放真實聲音</button>
      </div>
      <p class="small">畫面的振動已大幅放慢，聲音則是實際音高。</p>
      <a class="small" id="toGen" href="f-generator.html" style="color:var(--accent);font-weight:700">用頻率產生器發出這個頻率 →</a>
    </div>

    <div class="card" data-for="water">
      <h2>水波槽</h2>
      <div class="seg" id="wn" role="group" aria-label="波源數量">
        <button type="button" data-v="1">一個點波源</button>
        <button type="button" data-v="2">兩個點波源</button>
      </div>
      <div class="sl" id="sepBox">
        <label for="wsep">兩波源的距離</label>
        <input type="range" id="wsep" min="0.04" max="0.3" step="0.005">
        <div class="ends"><span>近</span><span>遠</span></div>
      </div>
      <div class="seg" id="depth" role="group" aria-label="水深">
        <button type="button" data-v="deep">深水</button>
        <button type="button" data-v="shallow">淺水</button>
      </div>
      <p class="small">點一下水面可以移動紅色浮標。</p>
    </div>

    <div class="card">
      <h2>顯示</h2>
      <div class="togs">
        <button type="button" class="tog" data-disp="track" aria-pressed="false" id="trackBtn">紅點追蹤</button>
        <button type="button" class="tog" data-disp="rails" data-for="rope spring" aria-pressed="false">振動軌道</button>
        <button type="button" class="tog" data-disp="arrows" aria-pressed="false">方向箭頭</button>
        <button type="button" class="tog" data-disp="labels" aria-pressed="false">名稱標示</button>
        <button type="button" class="tog" data-disp="info" aria-pressed="false">數值與公式</button>
        <button type="button" class="tog" data-opt="graph" data-for="spring sound" aria-pressed="false">疏密曲線</button>
        <button type="button" class="tog" data-opt="shade" data-for="sound" aria-pressed="false">疏密著色</button>
        <button type="button" class="tog" data-opt="trail" data-for="sound" aria-pressed="false">紅點軌跡</button>
      </div>
    </div>
  </section>
</div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const TAU = Math.PI * 2;

/* ---------- chalk palette (the board is always green) ---------- */
const BOARD = "#24372e";
const CH = {
  white: "#eef1e8", dim: "rgba(238,241,232,.5)", faint: "rgba(238,241,232,.2)",
  yellow: "#f3d66b", red: "#ff7a6a", blue: "#94ccf5", orange: "#f2a65a"
};
const FONT = '"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai","DFKai-SB",serif';

/* ---------- wave engine: each source's history is laid out along the distance the wave has travelled ---------- */
class Wave {
  constructor() { this.N = 8192; this.mask = 8191; this.cell = 1 / 1400; this.buf = new Float32Array(this.N); this.reset(); }
  reset() {
    this.buf.fill(0); this.D = 0; this.k = 0; this.prevS = 0; this.t = 0;
    this.amp = 0; this.pulses = []; this.manual = 0; this.src = 0; this.out = 0;
  }
  push(dt, v, s) {
    const D0 = this.D, D1 = D0 + v * dt, c = this.cell;
    while (this.k * c <= D1) {
      const f = D1 > D0 ? (this.k * c - D0) / (D1 - D0) : 1;
      this.buf[this.k & this.mask] = this.prevS + (s - this.prevS) * clamp(f, 0, 1);
      this.k++;
    }
    this.D = D1; this.prevS = s;
  }
  at(x) {                      // value emitted when the wave had travelled x less than now
    const p = (this.D - x) / this.cell;
    if (p < 0 || x < 0) return 0;
    const i = Math.floor(p);
    if (i >= this.k - 1) return this.prevS;
    const a = this.buf[i & this.mask], b = this.buf[(i + 1) & this.mask];
    return a + (b - a) * (p - i);
  }
}

/* ---------- media ---------- */
const ROPES = [
  { mu: 1, color: "#eef1e8", alt: "#93a89b", w: 4 },
  { mu: 3, color: "#e2c88e", alt: "#9a7a43", w: 6.5 },
  { mu: 8, color: "#c3ccd3", chain: true }
];
const SPRINGS = [
  { mu: 1, k: 1, r0: 0.12, color: "#94ccf5", w: 2.2 },
  { mu: 2, k: 4, r0: 0.3, color: "#dfe4e8", w: 1.6 },
  { mu: 3.5, k: 10, r0: 0.45, color: "#b9c3cb", w: 3 }
];
const MEDIA = {
  air: { name: "空氣", v: 0.2, real: 340, state: "gas", strain: 0.65 },
  water: { name: "水", v: 0.4, real: 1500, state: "liquid", strain: 0.05 },
  steel: { name: "鋼鐵", v: 0.7, real: 5200, state: "solid", strain: 0.025 },
  vacuum: { name: "真空", v: 0.2, real: 0, state: "none", strain: 0.65 }
};
const AUDIO_SCALE = 550;
const TANK_CM = 60;

const noRefl = () => ({ from: Infinity, to: -Infinity });
const mk1D = o => Object.assign({ wL: new Wave(), wR: new Wave(), phase: 0, endL: "src", endR: "none", invR: false,
  reflL: noRefl(), reflR: noRefl(), xL: new Wave(), xR: new Wave(), xreflL: noRefl(), xreflR: noRefl(), env: new Float32Array(241), warm: false }, o);
const S = {
  rope: mk1D({ mode: "cont", amp: 0.55, freq: 0.8, type: 0, tension: 6 }),
  spring: mk1D({ mode: "cont", amp: 0.6, freq: 0.7, type: 0, tension: 6, dir: "long", lastDir: "long", graph: false }),
  sound: mk1D({ mode: "cont", amp: 0.6, freq: 0.7, view: "macro", medium: "air", thermal: 0.15,
                shade: false, graph: false, trail: false, audio: false }),
  water: { wA: new Wave(), wB: new Wave(), phase: 0, D: 0, drops: [], mode: "cont", amp: 0.7, freq: 1.0,
           n: 2, sep: 0.2, depth: "deep", fx: 0.66, fy: 0.5, warm: false }
};
const DISP = { track: false, rails: false, arrows: false, labels: false, info: false };
let cur = "rope", playing = true, slow = false;

function speed(n) {
  const s = S[n];
  if (n === "rope") return 0.16 * Math.sqrt(s.tension / ROPES[s.type].mu);
  if (n === "spring") { const v = springSpeeds(); return s.dir === "long" ? v.l : v.t; }
  if (n === "water") return s.depth === "deep" ? 0.08 : 0.05;
  return MEDIA[s.medium].v;
}
/* a stretched spring: longitudinal waves are always at least as fast as transverse ones;
   the gap grows with the spring's unstretched length (nearly equal for a slinky) */
function springSpeeds() {
  const s = S.spring, sp = SPRINGS[s.type];
  const l = 0.3 * Math.sqrt(sp.k / sp.mu) * (0.75 + 0.025 * s.tension);
  const r = Math.min(0.85, sp.r0 * 12 / (s.tension + 6));
  return { l, t: l * Math.sqrt(1 - r) };
}
const isFree = () => S.spring.dir === "free";
const isLong = n => n === "sound" || (n === "spring" && S.spring.dir === "long");
/* liquids and solids barely compress: same loudness, far smaller particle displacement */

  }

      const ang = a * TAU / 8, r1 = 26, r2 = Math.min(H * 0.38, 90);

    }

  }

  const xe = (W - 36 - g.x0) / g.L, G = gradOf(makeU("sound"));
  const a = Math.abs(G(xe)) * presScale();

/* ---------- main loop ---------- */
let last = performance.now();
function frame(ts) {
  const dtReal = Math.min(0.05, (ts - last) / 1000); last = ts;
  const s = S[cur];
  if (playing) stepTab(cur, dtReal * (slow ? 0.3 : 1));
  if (W > 0 && H > 0) {
    background();
    if (cur === "water") drawWater();
    else {
      const g = geo();
      if (cur === "rope" || cur === "spring") {
        const U = makeU(cur);
        if (playing) updateEnvelope(cur, U, dtReal * (slow ? 0.3 : 1));
        cur === "rope" ? drawRope(g) : drawSpring(g);
      } else {
        if (s.view === "micro" && s.medium !== "vacuum") { genParts(g); updateThermal(s.wL.t); }
        if (playing) updateEar(g);
        drawSound(g);
      }
    }
  }
  updateAudio();
  if (ts - infoT > 200) { infoT = ts; updateInfo(); }
  requestAnimationFrame(frame);
}

segHandler("wn", v => { if (S.water.n !== +v) { S.water.n = +v; resetTab("water", true); } });
segHandler("depth", v => { S.water.depth = v; });

$("#amp").addEventListener("input", e => { S[cur].amp = +e.target.value; });
$("#freq").addEventListener("input", e => { S[cur].freq = +e.target.value; $("#toGen").href = "f-generator.html?f=" + Math.round(S.sound.freq * AUDIO_SCALE); if (S[cur].env) S[cur].env.fill(0); updateInfo(); });
$("#ropeT").addEventListener("input", e => { S.rope.tension = +e.target.value; S.rope.env.fill(0); });
$("#springT").addEventListener("input", e => { S.spring.tension = +e.target.value; S.spring.env.fill(0); });
$("#thermal").addEventListener("input", e => { S.sound.thermal = +e.target.value; });
$("#wsep").addEventListener("input", e => { S.water.sep = +e.target.value; });
$("#invR").addEventListener("click", () => { const s = S[cur]; s.invR = !s.invR; s.env.fill(0); syncUI(); });
$("#audio").addEventListener("click", () => { S.sound.audio = !S.sound.audio; if (S.sound.audio) ensureAudio(); syncUI(); });
$$("[data-disp]").forEach(b => b.addEventListener("click", () => { DISP[b.dataset.disp] = !DISP[b.dataset.disp]; syncUI(); }));
$$("[data-opt]").forEach(b => b.addEventListener("click", () => { const k = b.dataset.opt, s = S[cur]; if (k in s) { s[k] = !s[k]; syncUI(); } }));

$("#play").addEventListener("click", () => setPlaying(!playing));
$("#slow").addEventListener("click", e => { slow = !slow; e.currentTarget.setAttribute("aria-pressed", String(slow)); });
$("#reset").addEventListener("click", () => { resetTab(cur, false); setPlaying(true); });
function sendPulse(side) {
  const s = S[cur];
  if (s.mode !== "pulse") return;
  if (cur === "water") {
    const dur = 1 / s.freq; [s.wA, s.wB].forEach(w => w.pulses.push({ t0: w.t, dur, a: s.amp }));
  } else if (cur === "sound") {
    s.wL.pulses.push({ t0: s.wL.t, dur: 0.5 / s.freq, a: pulseAmp(cur) });
  } else {
    for (const sd of side === "B" ? ["L", "R"] : [side]) {
      if (s["end" + sd] !== "src") continue;
      const w = sd === "L" ? s.wL : s.wR, sign = sd === "R" && s.invR ? -1 : 1;
      w.pulses.push({ t0: w.t, dur: 0.5 / s.freq, a: sign * pulseAmp(cur) });
    }
  }
  if (!playing) setPlaying(true);
}
$("#pulseL").addEventListener("click", () => sendPulse("L"));
$("#pulseR").addEventListener("click", () => sendPulse("R"));
$("#pulseB").addEventListener("click", () => sendPulse("B"));
$("#fs").addEventListener("click", () => {
  const app = $("#app");
  try {
    if (document.fullscreenElement) document.exitFullscreen?.();
    else { const p = app.requestFullscreen?.(); if (p && p.catch) p.catch(() => {}); }
  } catch (e) {}
});
document.addEventListener("fullscreenchange", () => { $("#fs").textContent = document.fullscreenElement ? "離開全螢幕" : "全螢幕"; });

/* pointer on the board */
const boardXY = e => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
function dragTarget(side, px, py) {
  const g = geo(), lim = manualLimit(cur), dr = dragT[side];
  if (cur === "spring" && isFree()) {
    dr.target = clamp((g.midY - py) / g.ampPx, -1.15, 1.15);
    dr.tx = clamp(dr.startX + (px - dr.startPx) / g.L, -0.055, 0.055);
    return;
  }
  if (isLong(cur)) dr.target = clamp(dr.startVal + (px - dr.startPx) / g.L * (cur === "sound" ? MEDIA[S.sound.medium].strain / 0.65 : 1), -lim, lim);
  else dr.target = clamp((g.midY - py) / g.ampPx, -lim, lim);
}
function pickSide(s, px) {
  const act = activeSides(s);
  if (!act.length) return null;
  return act.length === 2 ? (px < W / 2 ? "L" : "R") : act[0];
}
canvas.addEventListener("pointerdown", e => {
  const [px, py] = boardXY(e), s = S[cur];
  if (cur === "water") {
    if (DISP.track && Math.hypot(px - s.fx * W, py - s.fy * H) < 24) {
      floatDrag = e.pointerId; try { canvas.setPointerCapture(e.pointerId); } catch (_) {} return;
    }
    if (s.mode === "manual") {
      s.drops.push({ x: px / W, y: py / H, D0: s.D, lam: speed("water") / s.freq, a: s.amp * 1.2 });
      if (s.drops.length > 30) s.drops.shift();
      if (!playing) setPlaying(true);
    } else if (s.mode === "pulse") sendPulse("L");
    else { s.fx = px / W; s.fy = py / H; }
    return;
  }
  if (s.mode === "pulse") { const sd = cur === "sound" ? "L" : pickSide(s, px); if (sd) sendPulse(sd); return; }
  if (s.mode !== "manual") return;
  const side = cur === "sound" ? "L" : pickSide(s, px);
  if (!side) return;
  const w = side === "L" ? s.wL : s.wR, dr = dragT[side];
  pointers.set(e.pointerId, side);
  dr.active = true; dr.startPx = px; dr.startVal = w.manual; dr.target = w.manual;
  if (cur === "spring") { const xw = side === "L" ? s.xL : s.xR; dr.startX = xw.manual; dr.tx = xw.manual; }
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  dragTarget(side, px, py); if (!playing) setPlaying(true); e.preventDefault();
});
canvas.addEventListener("pointermove", e => {
  const [px, py] = boardXY(e);
  if (floatDrag === e.pointerId) { S.water.fx = clamp(px / W, 0, 1); S.water.fy = clamp(py / H, 0, 1); return; }
  const side = pointers.get(e.pointerId);
  if (side) dragTarget(side, px, py);
});
const endDrag = e => {
  if (floatDrag === e.pointerId) floatDrag = null;
  const side = pointers.get(e.pointerId);
  if (side) { dragT[side].active = false; pointers.delete(e.pointerId); }
};
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);
canvas.addEventListener("lostpointercapture", endDrag);

document.addEventListener("keydown", e => {
  if (e.target !== document.body) return;
  if (e.code === "Space") { e.preventDefault(); setPlaying(!playing); }
  if (e.key === "p" || e.key === "P") sendPulse((cur === "rope" || cur === "spring") ? "B" : "L");
});

/* start */
let start = "rope";
const h0 = location.hash.slice(1);
if (h0 in S) start = h0;
else { try { const t = localStorage.getItem("wavelab-tab"); if (t in S) start = t; } catch (e) {} }
switchTab(start);
requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
</body>
</html>
