<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>頻率產生器</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2353b0ae'/><path d='M10.0,32.0 L11.1,27.7 L12.2,23.8 L13.3,20.7 L14.4,18.7 L15.5,18.0 L16.6,18.7 L17.7,20.7 L18.8,23.8 L19.9,27.7 L21.0,32.0 L22.1,36.3 L23.2,40.2 L24.3,43.3 L25.4,45.3 L26.5,46.0 L27.6,45.3 L28.7,43.3 L29.8,40.2 L30.9,36.3 L32.0,32.0 L33.1,27.7 L34.2,23.8 L35.3,20.7 L36.4,18.7 L37.5,18.0 L38.6,18.7 L39.7,20.7 L40.8,23.8 L41.9,27.7 L43.0,32.0 L44.1,36.3 L45.2,40.2 L46.3,43.3 L47.4,45.3 L48.5,46.0 L49.6,45.3 L50.7,43.3 L51.8,40.2 L52.9,36.3 L54.0,32.0' fill='none' stroke='white' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<meta name="description" content="產生 10 到 20000 Hz 的聲音，可快速滑動或精細微調頻率，並即時顯示波形。">
<meta name="category" content="實驗工具">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one instrument column — readout + play on top, coarse slider, fine steps, presets, then the scope.
   Palette: Pantone 2005 Blue Turquoise (#53B0AE) with mist white, deep teal ink and a coral trace. */
:root{
  --bg:#e4efee;
  --panel:#f1f8f7;
  --raised:#fbfefd;
  --fg:#173a3c;
  --muted:#4f6f70;
  --line:#c4dbd9;
  --mocha:#53b0ae;        /* Pantone 2005 Blue Turquoise 15-5217 */
  --mocha-deep:#1f6f6d;
  --on-mocha:#ffffff;
  --on-soft:#0f3433;
  --trace:#cf5f3a;
  --grid:rgba(23,58,60,.09);
  --axis:rgba(23,58,60,.28);
  --live:#c0392b;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1a1b; --panel:#142425; --raised:#1b2f30; --fg:#e2f2f1; --muted:#94b6b5; --line:#284142;
    --mocha:#6cc6c3; --mocha-deep:#6cc6c3; --on-mocha:#0e1a1b; --on-soft:#0e1a1b; --trace:#f0936f;
    --grid:rgba(226,242,241,.08); --axis:rgba(226,242,241,.3); --live:#ff8a70; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1a1b; --panel:#142425; --raised:#1b2f30; --fg:#e2f2f1; --muted:#94b6b5; --line:#284142;
    --mocha:#6cc6c3; --mocha-deep:#6cc6c3; --on-mocha:#0e1a1b; --on-soft:#0e1a1b; --trace:#f0936f;
    --grid:rgba(226,242,241,.08); --axis:rgba(226,242,241,.3); --live:#ff8a70; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:18px 32px;display:flex;flex-direction:column;gap:14px}

header{display:flex;align-items:baseline;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}
header h1{margin:0;font-size:1.5rem;letter-spacing:.06em;text-wrap:balance}
header a{color:var(--mocha-deep);font-size:.9rem;text-decoration:none;border-bottom:1px solid currentColor}
header a:hover{opacity:.8}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.label{font-size:.78rem;letter-spacing:.14em;color:var(--muted);font-weight:700;margin:0}

/* readout */
.readout{display:grid;grid-template-columns:1fr auto;gap:12px 18px;align-items:center}
.freqbox{display:flex;flex-direction:column;gap:4px;min-width:0}
.freqline{display:flex;align-items:baseline;gap:8px;min-width:0}
#freqInput{font-family:var(--f-num);font-weight:600;font-size:clamp(2.6rem,9vw,4.4rem);line-height:1;color:var(--fg);
  background:transparent;border:0;border-bottom:2px dashed transparent;padding:0;width:5.3ch;min-width:0;font-variant-numeric:tabular-nums;border-radius:0}
#freqInput:hover{border-bottom-color:var(--line)}
#freqInput:focus{outline:none;border-bottom-color:var(--mocha)}
#freqInput::-webkit-inner-spin-button,#freqInput::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
#freqInput{-moz-appearance:textfield;appearance:textfield}
.hz{font-family:var(--f-num);font-size:1.4rem;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.meta b{color:var(--fg);font-weight:500;font-family:var(--f-num)}
#play{font:inherit;font-weight:700;font-size:1.1rem;border:0;border-radius:14px;cursor:pointer;
  background:var(--mocha-deep);color:var(--on-mocha);padding:14px 22px;min-width:150px;min-height:64px;
  display:inline-flex;align-items:center;justify-content:center;gap:10px}
#play:hover{filter:brightness(1.06)}
#play .ico{width:0;height:0;border-left:14px solid currentColor;border-top:9px solid transparent;border-bottom:9px solid transparent}
#play.on{background:var(--raised);color:var(--fg);box-shadow:inset 0 0 0 2px var(--live)}
#play.on .ico{border:0;width:14px;height:14px;background:var(--live);border-radius:3px}
.liveDot{width:8px;height:8px;border-radius:50%;background:var(--live);display:none}
#play.on .liveDot{display:inline-block;animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}

/* sliders */
.slider{display:flex;flex-direction:column;gap:6px;margin-top:16px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;cursor:pointer;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(to right,var(--mocha) var(--p),var(--line) var(--p))}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:var(--line)}
input[type=range]::-moz-range-progress{height:8px;border-radius:99px;background:var(--mocha)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;margin-top:-8px;background:var(--raised);border:3px solid var(--mocha-deep);box-shadow:0 1px 3px rgba(0,0,0,.2)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--raised);border:3px solid var(--mocha-deep)}
input[type=range]:focus-visible{outline:2px solid var(--mocha);outline-offset:4px;border-radius:8px}
.ticks{position:relative;height:18px;font-family:var(--f-num);font-size:.76rem;color:var(--muted);margin-inline:12px}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}

/* fine steps */
.steps{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:14px}
.steps button{font-family:var(--f-num);font-size:.92rem;font-weight:500;border:1px solid var(--line);background:var(--raised);color:var(--fg);
  border-radius:10px;min-height:44px;cursor:pointer;padding:6px 2px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.steps button:hover{border-color:var(--mocha)}
.steps button:active{background:var(--mocha);color:var(--on-mocha);border-color:var(--mocha)}
.steps .gap{grid-column:span 1}
.stepnote{margin:6px 0 0;color:var(--muted);font-size:.82rem}

/* presets */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{font-family:var(--f-num);font-size:.88rem;border:1px solid var(--line);background:var(--raised);color:var(--fg);
  border-radius:9px;padding:6px 11px;min-height:38px;cursor:pointer}
.chips button:hover{border-color:var(--mocha)}
.chips button[aria-pressed="true"]{background:var(--mocha);border-color:var(--mocha);color:var(--on-soft);font-weight:600}

/* sound settings */
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:16px 24px;align-items:end}
.vol label{display:flex;justify-content:space-between;align-items:baseline}
.vol output{font-family:var(--f-num);color:var(--mocha-deep);font-weight:600}
.seg{display:flex;gap:4px;background:var(--raised);border:1px solid var(--line);border-radius:11px;padding:3px;margin-top:8px}
.seg button{flex:1;white-space:nowrap;font:inherit;font-size:.9rem;border:0;background:transparent;color:var(--muted);border-radius:8px;min-height:38px;cursor:pointer;padding:4px 6px}
.seg button[aria-pressed="true"]{background:var(--mocha);color:var(--on-soft);font-weight:700}

/* scope */
.scopehead{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;margin-bottom:10px}
.scopehead .seg{margin-top:0;min-width:340px}
.scopehead .seg button{font-family:var(--f-num)}
#scope{display:block;width:100%;height:220px;background:var(--raised);border:1px solid var(--line);border-radius:10px}
.scopefoot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:.84rem;margin-top:6px}

footer{color:var(--muted);font-size:.84rem;text-align:center}
kbd{font-family:var(--f-num);font-size:.8rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--raised)}
button:focus-visible,a:focus-visible{outline:2px solid var(--mocha);outline-offset:2px}

@media (max-width:620px){
  .readout{grid-template-columns:1fr}
  #play{width:100%}
  .steps{grid-template-columns:repeat(4,1fr)}
  .two{grid-template-columns:1fr}
  .scopehead .seg{min-width:0;width:100%}
  .ticks .wide{display:none}
}
@media (prefers-reduced-motion: reduce){ #play.on .liveDot{animation:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>頻率產生器</h1>
    <a id="toWave" href="wave-lab.html#sound">到「波動實驗台」看聲波怎麼傳播</a>
  </header>

  <section class="panel">
    <div class="readout">
      <div class="freqbox">
        <p class="label">頻率</p>
        <div class="freqline">
          <input id="freqInput" type="number" inputmode="decimal" min="10" max="20000" step="0.1" aria-label="頻率（赫茲），可直接輸入">
          <span class="hz">Hz</span>
        </div>
        <div class="meta">
          <span>週期 <b id="period"></b></span>
          <span>空氣中波長約 <b id="lambda"></b></span>
          <span id="noteBox">接近音名 <b id="note"></b></span>
        </div>
      </div>
      <button id="play" type="button" aria-pressed="false"><span class="ico"></span><span id="playText">播放聲音</span><span class="liveDot"></span></button>
    </div>

    <div class="slider">
      <input type="range" id="freqSlider" min="0" max="1000" step="1" aria-label="快速調整頻率">
      <div class="ticks" id="ticks"></div>
    </div>

    <div class="steps" role="group" aria-label="精細調整">
      <button type="button" data-step="-100">−100</button>
      <button type="button" data-step="-10">−10</button>
      <button type="button" data-step="-1">−1</button>
      <button type="button" data-step="-0.1">−0.1</button>
      <button type="button" data-step="0.1">+0.1</button>
      <button type="button" data-step="1">+1</button>
      <button type="button" data-step="10">+10</button>
      <button type="button" data-step="100">+100</button>
    </div>
    <p class="stepnote">按住按鈕可以連續調整；也可以點上方的數字直接輸入。</p>

    <div class="chips" id="chips" role="group" aria-label="常用頻率"></div>
  </section>

  <section class="panel two">
    <div class="vol">
      <label for="vol"><span class="label">音量</span><output id="volOut"></output></label>
      <input type="range" id="vol" min="0" max="100" step="1">
    </div>
    <div>
      <p class="label">音色</p>
      <div class="seg" id="wave" role="group" aria-label="音色">
        <button type="button" data-v="sine">正弦波</button>
        <button type="button" data-v="triangle">三角波</button>
        <button type="button" data-v="square">方波</button>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="scopehead">
      <p class="label">波形（聲音隨時間的振動）</p>
      <div class="seg" id="range" role="group" aria-label="時間範圍">
        <button type="button" data-v="1">1 ms</button>
        <button type="button" data-v="10">10 ms</button>
        <button type="button" data-v="100">100 ms</button>
        <button type="button" data-v="1000">1000 ms</button>
      </div>
    </div>
    <canvas id="scope" aria-label="聲音波形圖"></canvas>
    <div class="scopefoot"><span>橫軸：時間（毫秒）</span><span id="cycles"></span></div>
  </section>

  <footer>鍵盤：<kbd>空白鍵</kbd> 播放／停止　<kbd>←</kbd><kbd>→</kbd> 調 1 Hz　按住 <kbd>Shift</kbd> 調 10 Hz</footer>
</div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const FMIN = 10, FMAX = 20000;
const PRESETS = [20, 30, 60, 125, 250, 500, 1000, 2000, 4000, 8000, 16000, 18000, 19000, 20000];
const TYPE_GAIN = { sine: 1, triangle: 0.95, square: 0.45 };   // roughly equal loudness across timbres

const fi = $("freqInput");
function fitInput() { fi.style.width = Math.max(4, String(fi.value).length + 0.4) + "ch"; }
fi.addEventListener("input", fitInput);
const st = { f: 440, vol: 50, type: "sine", range: 10, playing: false };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const round1 = v => Math.round(v * 10) / 10;
const LN = Math.log(FMAX / FMIN);
const f2pos = f => Math.round(1000 * Math.log(f / FMIN) / LN);
const pos2f = p => FMIN * Math.exp(LN * p / 1000);

/* restore last settings, or ?f=440 from a link */
try {
  const saved = JSON.parse(localStorage.getItem("fgen-settings") || "null");
  if (saved) Object.assign(st, { f: saved.f, vol: saved.vol, type: saved.type, range: saved.range }, { playing: false });
} catch (e) {}
const qf = parseFloat(new URLSearchParams(location.search).get("f"));
if (qf) st.f = qf;
st.f = clamp(round1(+st.f || 440), FMIN, FMAX);
if (!(st.type in TYPE_GAIN)) st.type = "sine";
if (![1, 10, 100, 1000].includes(st.range)) st.range = 10;
function save() { try { localStorage.setItem("fgen-settings", JSON.stringify(st)); } catch (e) {} }

/* ---------- audio ---------- */
let ac = null, osc = null, gain = null;
const targetGain = () => (st.vol / 100) * TYPE_GAIN[st.type];
function start() {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
  } catch (e) { return; }
  const t = ac.currentTime;
  osc = ac.createOscillator(); gain = ac.createGain();
  osc.type = st.type; osc.frequency.setValueAtTime(st.f, t);
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(targetGain(), t + 0.03);   // fade in: no click
  osc.connect(gain).connect(ac.destination);
  osc.start(t);
  st.playing = true; syncPlay();
}
function stop() {
  if (osc && ac) {
    const t = ac.currentTime, o = osc, g = gain;
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(g.gain.value, t);
    g.gain.linearRampToValueAtTime(0, t + 0.04);                // fade out: no click
    o.stop(t + 0.06);
    o.onended = () => { o.disconnect(); g.disconnect(); };
  }
  osc = gain = null; st.playing = false; syncPlay();
}
function liveUpdate() {
  if (!osc || !ac) return;
  const t = ac.currentTime;
  osc.frequency.setTargetAtTime(st.f, t, 0.008);
  if (osc.type !== st.type) osc.type = st.type;
  gain.gain.setTargetAtTime(targetGain(), t, 0.02);
}
function syncPlay() {
  $("play").classList.toggle("on", st.playing);
  $("play").setAttribute("aria-pressed", String(st.playing));
  $("playText").textContent = st.playing ? "停止" : "播放聲音";
}
$("play").addEventListener("click", () => st.playing ? stop() : start());

/* ---------- frequency ---------- */
const NOTES = ["C", "C♯", "D", "D♯", "E", "F", "F♯", "G", "G♯", "A", "A♯", "B"];
const SOLFA = ["Do", "Do♯", "Re", "Re♯", "Mi", "Fa", "Fa♯", "Sol", "Sol♯", "La", "La♯", "Si"];
function noteName(f) {
  const n = Math.round(12 * Math.log2(f / 440)) + 57;     // 57 = A4 counted from C0
  const oct = Math.floor(n / 12), k = ((n % 12) + 12) % 12;
  return `${NOTES[k]}${oct}（${SOLFA[k]}）`;
}
function fmtTime(sec) {
  if (sec >= 1) return sec.toFixed(2) + " 秒";
  const ms = sec * 1000;
  return (ms >= 10 ? ms.toFixed(1) : ms >= 1 ? ms.toFixed(2) : ms.toFixed(3)) + " 毫秒";
}
function fmtLen(m) {
  if (m >= 1) return m.toFixed(2) + " 公尺";
  const cm = m * 100;
  return (cm >= 10 ? cm.toFixed(1) : cm.toFixed(2)) + " 公分";
}
function setFreq(f, from) {
  st.f = clamp(round1(f), FMIN, FMAX);
  if (from !== "input" || document.activeElement !== fi) fi.value = st.f.toFixed(1);
  fitInput();
  if (from !== "slider") $("freqSlider").value = f2pos(st.f);
  paintRange($("freqSlider"));
  $("period").textContent = fmtTime(1 / st.f);
  $("lambda").textContent = fmtLen(340 / st.f);
  const musical = st.f >= 27 && st.f <= 4200;
  $("noteBox").hidden = !musical;
  if (musical) $("note").textContent = noteName(st.f);
  document.querySelectorAll("#chips button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.f === st.f)));
  liveUpdate(); drawScope(); save();
}

$("freqSlider").addEventListener("input", e => {
  const raw = pos2f(+e.target.value);
  const nice = raw < 100 ? round1(raw) : raw < 1000 ? Math.round(raw) : Math.round(raw / 10) * 10;
  setFreq(nice, "slider");
});
fi.addEventListener("input", () => { const v = parseFloat(fi.value); if (v >= FMIN && v <= FMAX) setFreq(v, "input"); });
fi.addEventListener("change", () => { const v = parseFloat(fi.value); setFreq(isNaN(v) ? st.f : v); });
fi.addEventListener("keydown", e => { if (e.key === "Enter") fi.blur(); });
fi.addEventListener("blur", () => { fi.value = st.f.toFixed(1); });
fi.addEventListener("focus", () => fi.select());

/* press-and-hold repeat on the fine buttons */
document.querySelectorAll(".steps button").forEach(b => {
  const step = parseFloat(b.dataset.step);
  let t1 = null, t2 = null;
  const bump = () => setFreq(st.f + step);
  const end = () => { clearTimeout(t1); clearInterval(t2); t1 = t2 = null; };
  b.addEventListener("pointerdown", e => {
    e.preventDefault(); bump();
    t1 = setTimeout(() => { t2 = setInterval(bump, 70); }, 420);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev => b.addEventListener(ev, end));
  b.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); bump(); } });
});

/* presets */
PRESETS.forEach(f => {
  const b = document.createElement("button");
  b.type = "button"; b.dataset.f = f;
  b.textContent = f >= 1000 ? (f / 1000) + "k" : String(f);
  b.title = f + " Hz";
  b.addEventListener("click", () => setFreq(f));
  $("chips").appendChild(b);
});

/* slider tick labels at their log positions */
[[20, "20"], [100, "100"], [1000, "1k"], [10000, "10k"], [20000, "20k Hz"]].forEach(([f, t]) => {
  const s = document.createElement("span");
  if (f === 10000) s.className = "wide";
  s.style.left = (f2pos(f) / 10) + "%"; s.textContent = t;
  if (f === 20000) { s.style.transform = "translateX(-88%)"; }
  $("ticks").appendChild(s);
});
function paintRange(el) {
  const p = (el.value - el.min) / (el.max - el.min) * 100;
  el.style.setProperty("--p", p + "%");
}

/* volume & timbre */
$("vol").addEventListener("input", e => { st.vol = +e.target.value; $("volOut").textContent = st.vol + "%"; paintRange(e.target); liveUpdate(); drawScope(); save(); });
function setSeg(id, v) { document.querySelectorAll(`#${id} button`).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === String(v)))); }
document.querySelectorAll("#wave button").forEach(b => b.addEventListener("click", () => { st.type = b.dataset.v; setSeg("wave", st.type); liveUpdate(); drawScope(); save(); }));
document.querySelectorAll("#range button").forEach(b => b.addEventListener("click", () => { st.range = +b.dataset.v; setSeg("range", st.range); drawScope(); save(); }));

/* ---------- scope ---------- */
const cv = $("scope"), ctx = cv.getContext("2d");
let W = 0, H = 0;
function resize() {
  const r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawScope();
}
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function shape(ph) {   // ph in cycles
  const x = ph - Math.floor(ph);
  if (st.type === "square") return x < 0.5 ? 1 : -1;
  if (st.type === "triangle") return x < 0.25 ? 4 * x : x < 0.75 ? 2 - 4 * x : 4 * x - 4;
  return Math.sin(2 * Math.PI * x);
}
function drawScope() {
  if (!W) return;
  const padL = 34, padB = 22, padT = 10, padR = 10;
  const pw = W - padL - padR, ph = H - padT - padB, mid = padT + ph / 2;
  const A = (ph / 2 - 6) * (st.vol / 100);
  ctx.clearRect(0, 0, W, H);
  ctx.font = `12px ${css("--f-num")}`;
  /* grid */
  ctx.strokeStyle = css("--grid"); ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i <= 10; i++) { const x = Math.round(padL + pw * i / 10) + 0.5; ctx.moveTo(x, padT); ctx.lineTo(x, padT + ph); }
  for (let j = 0; j <= 4; j++) { const y = Math.round(padT + ph * j / 4) + 0.5; ctx.moveTo(padL, y); ctx.lineTo(padL + pw, y); }
  ctx.stroke();
  ctx.strokeStyle = css("--axis"); ctx.beginPath(); ctx.moveTo(padL, Math.round(mid) + 0.5); ctx.lineTo(padL + pw, Math.round(mid) + 0.5); ctx.stroke();
  /* time labels */
  ctx.fillStyle = css("--muted"); ctx.textBaseline = "top";
  for (let i = 0; i <= 10; i += 2) {
    const v = st.range * i / 10, x = padL + pw * i / 10;
    ctx.textAlign = i === 0 ? "left" : i === 10 ? "right" : "center";
    ctx.fillText(st.range === 1 ? v.toFixed(1) : String(Math.round(v)), x, padT + ph + 5);
  }
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  ctx.fillText("+", padL - 8, padT + 6); ctx.fillText("0", padL - 8, mid); ctx.fillText("−", padL - 8, padT + ph - 6);
  /* trace */
  const cycles = st.f * st.range / 1000, perPx = cycles / pw;
  ctx.strokeStyle = css("--trace"); ctx.fillStyle = css("--trace");
  if (perPx > 0.35) {
    /* too many vibrations to draw one by one: shade the band they fill */
    ctx.globalAlpha = 0.35; ctx.fillRect(padL, mid - A, pw, 2 * A); ctx.globalAlpha = 1;
    ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(padL, mid - A); ctx.lineTo(padL + pw, mid - A); ctx.moveTo(padL, mid + A); ctx.lineTo(padL + pw, mid + A); ctx.stroke();
    $("cycles").textContent = `這段時間振動約 ${Math.round(cycles).toLocaleString()} 次，太密了，只畫出振動範圍；請改用較短的時間範圍。`;
  } else {
    ctx.lineWidth = 2.2; ctx.lineJoin = "round"; ctx.beginPath();
    const n = Math.max(600, Math.ceil(pw * 3));
    for (let i = 0; i <= n; i++) {
      const x = padL + pw * i / n, y = mid - A * shape(cycles * i / n);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
    $("cycles").textContent = cycles >= 1 ? `這段時間振動 ${cycles >= 10 ? Math.round(cycles) : cycles.toFixed(1)} 次` : `這段時間只振動了 ${cycles.toFixed(2)} 次，請改用較長的時間範圍。`;
  }
}
new ResizeObserver(resize).observe(cv);
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", drawScope);
new MutationObserver(drawScope).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

/* keyboard */
document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" && e.target.type !== "range") return;
  if (e.code === "Space" && tag !== "button") { e.preventDefault(); st.playing ? stop() : start(); }
  if ((e.key === "ArrowRight" || e.key === "ArrowLeft") && tag !== "input") {
    e.preventDefault(); setFreq(st.f + (e.key === "ArrowRight" ? 1 : -1) * (e.shiftKey ? 10 : 1));
  }
});

/* link to the wave simulator */
$("toWave").addEventListener("click", () => { if (st.playing) stop(); });

/* init */
$("vol").value = st.vol; $("volOut").textContent = st.vol + "%"; paintRange($("vol"));
setSeg("wave", st.type); setSeg("range", st.range);
setFreq(st.f);
resize();
})();
</script>
</body>
